# Used only by scripts/check-container.sh: serves the game under /qa/scorched/
# through a stock nginx, exercising the same proxy settings production needs.
map $http_upgrade $connection_upgrade { default upgrade; '' close; }
server {
    listen 8080;
    location = /qa/scorched { return 308 /qa/scorched/; }
    location /qa/scorched/ {
        proxy_pass http://scorched-earth:8080/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
